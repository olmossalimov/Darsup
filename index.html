<script>
const SB=supabase.createClient('https://iesjxpkjrlbhmcfoenss.supabase.co','sb_publishable_ZrDUnel0dUHJfW49bX7yGQ_L8MH-KZq');
const uid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now().toString(36)).replace(/-/g,'').slice(0,16);
const $=s=>document.querySelector(s),today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'];
const fmt=d=>{const p=String(d||'').split('-');return p.length===3&&MON[+p[1]-1]?(+p[2])+'-'+MON[+p[1]-1]:(d||'')};
const LOGO='<i><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 17V4M4 10l6-6 6 6" stroke="#04261C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
const CH='<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
let U,P,groups=[],gid=null,members=[],lessons=[],att={},hws=[],subs={},tab='lessons',selL=null,mode='in';
const G=()=>groups.find(g=>g.id===gid),T=()=>P&&P.role==='teacher',mine=()=>members[0];
const hint=m=>/bucket not found/i.test(m)?"Saqlash joyi yaratilmagan. darsup-fayllar.sql ni Supabase'da ishga tushiring.":/row-level security|unauthorized|policy/i.test(m)?"Ruxsat yo'q. darsup-fayllar.sql dagi qoidalar qo'yilmagan.":/mime|not supported|invalid/i.test(m)?"Fayl turi ruxsat etilmagan. darsup-fayllar.sql ni qayta ishga tushiring.":/size|too large|exceed/i.test(m)?'Fayl juda katta.':m;
const toast=(t,ms)=>{const e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,ms||3800)};
const netErr=m=>/fetch|network/i.test(m)?"Serverga ulanib bo'lmadi. Internetni tekshiring va saytni chop etilgan manzilda oching.":m;
const db=async p=>{const r=await p;if(r.error){toast(netErr(r.error.message));throw r.error}return r.data};

async function boot(){
 const {data:{session}}=await SB.auth.getSession();if(!session)return authView();
 U=session.user;P=await db(SB.from('profiles').select('*').eq('id',U.id).maybeSingle())||{role:'teacher',full_name:''};
 tab=T()?'lessons':'hw';await loadGroups();render()}
async function loadGroups(){
 groups=await db(SB.from('groups').select('*').order('created_at'));
 if(!groups.find(g=>g.id===gid))gid=groups[0]?groups[0].id:null;await loadGroup()}
async function loadGroup(){
 members=[];lessons=[];hws=[];att={};subs={};cmts={};if(!gid)return;
 const f=t=>SB.from(t).select('*').eq('group_id',gid);
 const [m,l,a,h,s,cm]=await Promise.all([db(f('members').order('created_at')),db(f('lessons').order('lesson_date',{ascending:false}).order('created_at',{ascending:false})),db(f('attendance')),db(f('homework').order('created_at',{ascending:false})),db(f('submissions')),db(f('comments').order('created_at'))]);
 members=m;lessons=l;hws=h;cm.forEach(x=>{const k=x.homework_id+'|'+x.member_id;(cmts[k]=cmts[k]||[]).push(x)});a.forEach(x=>att[x.lesson_id+'|'+x.member_id]=x.status);s.forEach(x=>subs[x.homework_id+'|'+x.member_id]=x);await signAll()}
let signed={};
async function signAll(){signed={};const ps=[];lessons.forEach(l=>(l.materials||[]).forEach(m=>{if(m.path)ps.push(m.path)}));if(!ps.length)return;
 const {data}=await SB.storage.from('materials').createSignedUrls(ps,3600);(data||[]).forEach(x=>{if(x.signedUrl)signed[x.path]=x.signedUrl})}

function authView(){
 const up=mode==='up';
 $('#app').innerHTML=`<div class="logo" style="margin:30px 0 16px">${LOGO}DarsUp</div><div class="card"><h2>${up?"Ro'yxatdan o'tish":'Kirish'}</h2>`+(up?`<input id="an" placeholder="Ism va familiya" autocomplete="name"><select id="ar" style="width:100%"><option value="teacher">Men o'qituvchiman</option><option value="student">Men o'quvchiman</option></select>`:'')+`<input id="ae" type="email" placeholder="Email" autocomplete="email"><div class="pw"><input id="ap" type="password" placeholder="Parol (kamida 6 belgi)" autocomplete="${up?'new-password':'current-password'}"><button type="button" class="eye" data-a="eye" aria-label="Parolni ko'rsatish yoki yashirish">${EYE}</button></div><button class="btn pri" data-a="auth">${up?"Ro'yxatdan o'tish":'Kirish'}</button><button class="btn" data-a="google"><b>G</b> Google bilan kirish</button><button class="btn" data-a="amode">${up?'Akkauntim bor, kirish':"Akkaunt yo'qmi? Ro'yxatdan o'ting"}</button></div>`}

function vJoin(){return `<div class="card"><h2>Guruhga qo'shilish</h2><span class="mu">O'qituvchingiz bergan guruh kodini kiriting.</span><input id="jn" placeholder="Ismingiz" value="${esc(P.full_name)}"><input id="jc" placeholder="Guruh kodi, masalan: A1B2C3"><button class="btn pri" data-a="join">Qo'shilish</button></div>`}

function vGroups(){
 const g=G();let h='';
 if(g)h+=`<div class="card cur"><span class="mu">Hozirgi guruh</span><h2 style="font-size:26px">${esc(g.name)}</h2><div class="row" style="align-items:center"><span class="mu">Guruh kodi (o'quvchilar shu bilan qo'shiladi):</span><span class="code">${esc(g.join_code)}</span><button class="btn" data-a="copy" data-c="${esc(g.join_code)}">Nusxalash</button></div><div class="row"><input id="rn" value="${esc(g.name)}" aria-label="Guruh nomi"><button class="btn" data-a="renG">Nomini o'zgartirish</button></div><div class="row"><input id="ns" placeholder="O'quvchi ismini qo'lda qo'shish"><button class="btn pri" data-a="addS">Qo'shish</button></div><div>${members.map(m=>`<span class="chip">${esc(m.full_name)}${m.student_id?' ✓':''} <button class="x" data-a="delS" data-m="${m.id}" aria-label="O'chirish">×</button></span>`).join('')}</div><span class="mu">✓ belgisi o'quvchi o'z akkaunti bilan kirganini bildiradi.</span><button class="btn" data-a="delG">Guruhni o'chirish</button></div>`;
 h+=`<div class="card"><h2>Yangi guruh ochish</h2><span class="mu">Nomini o'zingiz yozing, masalan: Toq 2-4, Juft 5-7.</span><div class="row"><input id="ng" placeholder="Guruh nomi"><button class="btn pri" data-a="addG">Guruh ochish</button></div></div>`;
 const o=groups.filter(x=>x.id!==gid);if(o.length)h+=`<h2 style="margin:4px 4px 10px">Boshqa guruhlar</h2>`+o.map(x=>`<div class="card"><h2>${esc(x.name)}</h2><button class="btn" data-a="openG" data-g="${x.id}">Guruhni ochish</button></div>`).join('');
 return h}

const KINDS={reading:'Reading',vocab:"Lug'at",listening:'Listening'};
const driveId=u=>{const r=u.match(/\/d\/([\w-]{20,})|[?&]id=([\w-]{20,})/);return r&&(r[1]||r[2])};
const ytId=u=>{const r=u.match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/);return r&&r[1]};
function media(m){
 if(m.path){const f=signed[m.path];if(!f)return '<span class="mu">Fayl topilmadi yoki yuklanmoqda…</span>';
  if(/pdf|msword|wordprocessingml/.test(m.mime||''))return `<a class="btn mlink" href="${esc(f)}" target="_blank" rel="noopener"><b>${/pdf/.test(m.mime)?'PDF':'Word'}</b> · ${esc(m.title||'Fayl')} (ochish)</a>`;
  return (m.mime||'').startsWith('audio')?`<audio controls preload="none" src="${esc(f)}" style="width:100%"></audio>`:`<a href="${esc(f)}" target="_blank" rel="noopener"><img class="mimg" loading="lazy" src="${esc(f)}" alt="${esc(m.title||'Rasm')}"></a>`}
 const u=m.url,d=driveId(u),y=ytId(u);
 if(y)return `<iframe class="emb" src="https://www.youtube-nocookie.com/embed/${y}" allowfullscreen loading="lazy" title="Video"></iframe>`;

 if(e.target.id==='sl'){selL=e.target.value;render()}
 if(e.target.id==='gs'){gid=e.target.value;await loadGroup();render()}});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;if(U)render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.card');if(c){const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}});
const MAXD=10*1024*1024;
async function shrink(f){const bm=await createImageBitmap(f),k=Math.min(1,1600/Math.max(bm.width,bm.height)),c=document.createElement('canvas');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,'image/jpeg',.82))}
const MIMES={pdf:'application/pdf',doc:'application/msword',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
const extOf=n=>(n.split('.').pop()||'').toLowerCase().replace(/[^a-z0-9]/g,'');
async function upFiles(card,files){
 const lid=card.dataset.l,l=lessons.find(x=>x.id===lid),kd=card.querySelector('.dk').value,arr=[...(l.materials||[])],bk=SB.storage.from('materials'),list=[...files];let n=0,ok=0;
 for(const f of list){n++;toast('Yuklanmoqda '+n+' / '+list.length+'…');
  try{const ex=extOf(f.name);let blob=f,ext,mime;
   if(f.type.startsWith('image/')){
    try{blob=await shrink(f);if(!blob)throw 0;ext='jpg';mime='image/jpeg'}
    catch(_){if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)||f.size>8*1024*1024){toast(f.name+": rasm formatini o'qib bo'lmadi yoki juda katta. JPG yoki PNG qilib yuboring");continue}
     blob=f;mime=f.type;ext=f.type.split('/')[1].replace('jpeg','jpg')}}
   else if(MIMES[ex]){ext=ex;mime=MIMES[ex];if(f.size>MAXD){toast(f.name+': fayl 10 MB dan katta');continue}}
   else{toast(f.name+': faqat rasm (PNG, JPG), PDF yoki Word fayl yuklash mumkin');continue}
   const path=gid+'/'+lid+'/'+uid()+'.'+ext,r=await bk.upload(path,blob,{contentType:mime});
   if(r.error){toast(f.name+': '+hint(r.error.message||''),15000);continue}
   arr.push({kind:kd,path,mime,title:f.name.replace(/\.[^.]+$/,'')});ok++}
  catch(e){console.error(e);toast(f.name+": yuklab bo'lmadi ("+hint((e&&e.message)||"noma'lum xato")+")",15000)}}
 if(ok){await db(SB.from('lessons').update({materials:arr}).eq('id',lid));await loadGroup();render();toast('Yuklandi: '+ok+' ta fayl')}}
const inDrop=e=>e.target.closest&&e.target.closest('.drop');
addEventListener('dragover',e=>{e.preventDefault();const d=inDrop(e);document.querySelectorAll('.drop.over').forEach(x=>x!==d&&x.classList.remove('over'));if(d)d.classList.add('over')});
addEventListener('drop',e=>{e.preventDefault();const d=inDrop(e);document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));if(d&&e.dataTransfer.files.length)upFiles(d.closest('.lcard'),e.dataTransfer.files)});
document.addEventListener('click',e=>{const d=inDrop(e);if(d&&!e.target.classList.contains('dfile'))d.querySelector('.dfile').click()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('drop')){e.preventDefault();e.target.querySelector('.dfile').click()}});
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('dfile')){upFiles(e.target.closest('.lcard'),e.target.files);e.target.value=''}});
document.addEventListener('change',e=>{if(e.target.id==='avf'&&e.target.files[0]){setAvatar(e.target.files[0]);e.target.value=''}});
boot().catch(e=>{console.error(e);authView()});
</script></body></html>
